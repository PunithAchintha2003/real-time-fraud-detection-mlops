global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "fraud-detection-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "host.docker.internal:8000"
        labels:
          service: "fraud-detection-api"
          environment: "docker-compose"

  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "prometheus:9090"
        labels:
          service: "prometheus"
          environment: "docker-compose"
