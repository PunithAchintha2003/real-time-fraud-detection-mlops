name: CI

on:
  push:
    branches:
      - main
      - "00*"
      - "01*"
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Python import checks
        run: |
          python -c "from src.data.preprocessing import preprocess_features; print('preprocessing import OK')"
          python -c "from src.inference.predict import fraud_detection_service; print('inference import OK')"

      - name: Run tests
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t real-time-fraud-detection-mlops:ci .
