name: CI/CD

on:
  push:
    branches:
      - main
      - "00*"
      - "01*"
  pull_request:
    branches:
      - main

jobs:
  test-build-and-push:
    name: Test, Build, and Push Docker Image
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow-ci.db
      DOCKER_IMAGE_NAME: achintha2003/real-time-fraud-detection-mlops

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Python import checks
        run: |
          python -c "from src.data.preprocessing import preprocess_features; print('preprocessing import OK')"
          python -c "from src.inference.predict import fraud_detection_service; print('inference import OK')"

      - name: Create CI MLflow champion model and local artifacts
        run: |
          python scripts/create_ci_model_artifacts.py
          ls -lah models
          ls -lah mlflow-ci.db

      - name: Run tests
        run: |
          pytest -v

      - name: Build Docker image for CI
        run: |
          docker build -t $DOCKER_IMAGE_NAME:ci .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            achintha2003/real-time-fraud-detection-mlops:latest
            achintha2003/real-time-fraud-detection-mlops:${{ github.sha }}
