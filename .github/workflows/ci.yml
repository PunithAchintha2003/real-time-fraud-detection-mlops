name: Full-stack CI/CD

on:
  push:
    branches:
      - main
      - "00*"
      - "01*"
      - "02*"
  pull_request:
    branches:
      - main

jobs:
  ml-service-ci:
    name: ML Service Tests
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/apps/ml-service
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/apps/ml-service/mlflow-ci.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('apps/ml-service/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: pip install -r apps/ml-service/requirements.txt

      - name: Run Python import checks
        working-directory: apps/ml-service
        run: |
          python -c "from src.data.preprocessing import preprocess_features; print('preprocessing import OK')"
          python -c "from src.inference.predict import fraud_detection_service; print('inference import OK')"
          python -c "from src.features.business_features import make_business_features; print('business features import OK')"

      - name: Create CI MLflow champion model and local artifacts
        working-directory: apps/ml-service
        run: |
          python scripts/create_ci_model_artifacts.py
          python -m src.training.train_business_model
          ls -lah models
          ls -lah mlflow-ci.db

      - name: Run ML service tests
        working-directory: apps/ml-service
        run: pytest -v

  backend-ci:
    name: Backend Build and Lint
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://fraud_user:fraud_password@localhost:55432/fraud_auth_db?schema=public
      JWT_SECRET: ci_test_secret
      JWT_EXPIRES_IN: 1d
      PORT: 4000
      ML_SERVICE_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npm run prisma:generate

      - name: Run backend lint
        working-directory: apps/backend
        run: npm run lint

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

  frontend-ci:
    name: Frontend Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs:
      - ml-service-ci
      - backend-ci
      - frontend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml config > /tmp/fullstack-compose.yml
          echo "Docker Compose config is valid"

      - name: Build ML service image
        run: |
          docker build \
            -f infrastructure/docker/Dockerfile.ml-service \
            -t real-time-fraud-detection-mlops-ml-service:ci \
            .

      - name: Build backend image
        run: |
          docker build \
            -f infrastructure/docker/Dockerfile.backend \
            -t real-time-fraud-detection-mlops-backend:ci \
            .

      - name: Build frontend image
        run: |
          docker build \
            -f infrastructure/docker/Dockerfile.frontend \
            -t real-time-fraud-detection-mlops-frontend:ci \
            .

  dockerhub-push:
    name: Push ML Service Image to Docker Hub
    runs-on: ubuntu-latest
    needs:
      - docker-build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ML service image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.ml-service
          push: true
          tags: |
            achintha2003/real-time-fraud-detection-mlops:latest
            achintha2003/real-time-fraud-detection-mlops:${{ github.sha }}
