name: real-time-fraud-detection-mlops

services:
  # ==========================================================
  # MLFLOW TRACKING SERVER
  # ==========================================================
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    container_name: fraud-detection-mlflow

    ports:
      - "5001:5000"

    environment:
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: "5000"

    volumes:
      - mlflow-db:/mlflow/db
      - mlflow-artifacts:/mlflow/mlruns

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/db/mlflow.db
      - --default-artifact-root
      - /mlflow/mlruns
      - --allowed-hosts
      - mlflow-server,mlflow-server:5000,localhost,localhost:5001,127.0.0.1,127.0.0.1:5001

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

    networks:
      - fraud-detection-network

  # ==========================================================
  # MODEL TRAINING SERVICE
  # ==========================================================
  trainer:
    profiles:
      - training

    build:
      context: ../../apps/ml-service
      dockerfile: Dockerfile

    image: real-time-fraud-detection-trainer:latest
    container_name: fraud-detection-trainer

    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_EXPERIMENT_NAME: fraud-detection-model-comparison
      MLFLOW_REGISTERED_MODEL_NAME: FraudDetectionModel
      MLFLOW_MODEL_ALIAS: champion
      FRAUD_THRESHOLD: "0.5"
      GIT_PYTHON_REFRESH: quiet

    volumes:
      - ../../apps/ml-service/data:/app/data:ro
      - ../../apps/ml-service/models:/app/models
      - mlflow-artifacts:/mlflow/mlruns

    depends_on:
      mlflow-server:
        condition: service_healthy

    command:
      - python
      - -m
      - src.training.train

    restart: "no"

    networks:
      - fraud-detection-network

  # ==========================================================
  # FASTAPI ML INFERENCE SERVICE
  # ==========================================================
  ml-service:
    build:
      context: ../../apps/ml-service
      dockerfile: Dockerfile

    image: real-time-fraud-detection-ml-service:latest
    container_name: fraud-detection-ml-service

    ports:
      - "8000:8000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_EXPERIMENT_NAME: fraud-detection-model-comparison
      MLFLOW_REGISTERED_MODEL_NAME: FraudDetectionModel
      MLFLOW_MODEL_ALIAS: champion
      FRAUD_THRESHOLD: "0.5"
      GIT_PYTHON_REFRESH: quiet

    volumes:
      - ../../apps/ml-service/models:/app/models
      - mlflow-artifacts:/mlflow/mlruns

    depends_on:
      mlflow-server:
        condition: service_healthy

    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    restart: unless-stopped

    networks:
      - fraud-detection-network

  # ==========================================================
  # POSTGRESQL DATABASE
  # ==========================================================
  postgres:
    image: postgres:17-alpine
    container_name: fraud-detection-postgres

    ports:
      - "127.0.0.1:15432:5432"

    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: fraud_admin
      POSTGRES_PASSWORD: fraud_password

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U fraud_admin -d fraud_detection"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - fraud-detection-network

# ============================================================
# NETWORKS
# ============================================================
networks:
  fraud-detection-network:
    name: fraud-detection-network
    driver: bridge

# ============================================================
# PERSISTENT VOLUMES
# ============================================================
volumes:
  mlflow-db:
    name: fraud-detection-mlflow-db

  mlflow-artifacts:
    name: fraud-detection-mlflow-artifacts

  postgres-data:
    name: fraud-detection-postgres-data