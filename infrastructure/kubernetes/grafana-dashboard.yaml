apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: fraud-detection
data:
  dashboard-provider.yaml: |
    apiVersion: 1

    providers:
      - name: Fraud Detection Dashboards
        orgId: 1
        folder: Fraud Detection MLOps
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-fraud-dashboard
  namespace: fraud-detection
data:
  fraud-detection-observability.json: |
    {
      "uid": "fraud-detection-observability",
      "title": "Fraud Detection Observability",
      "tags": ["fraud-detection", "mlops", "kubernetes"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Backend Requests",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(fraud_backend_http_requests_total[5m]))",
              "legendFormat": "requests/sec"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Backend Memory",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "fraud_backend_process_resident_memory_bytes",
              "legendFormat": "memory"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "ML Service Memory",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "process_resident_memory_bytes{job=\"fraud-ml-service\"}",
              "legendFormat": "ml memory"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Prometheus Targets UP",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(up)",
              "legendFormat": "up targets"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Backend HTTP Request Rate",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum by (method, route, status_code) (rate(fraud_backend_http_requests_total[5m]))",
              "legendFormat": "{{method}} {{route}} {{status_code}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Backend Request Duration p95",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le, route) (rate(fraud_backend_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{route}} p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Backend CPU Seconds",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "rate(fraud_backend_process_cpu_seconds_total[5m])",
              "legendFormat": "backend cpu"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "ML Service CPU Seconds",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "rate(process_cpu_seconds_total{job=\"fraud-ml-service\"}[5m])",
              "legendFormat": "ml cpu"
            }
          ]
        },
        {
          "id": 9,
          "type": "stat",
          "title": "ML Prediction Window Size",
          "gridPos": { "x": 0, "y": 20, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "ml_business_prediction_window_size",
              "legendFormat": "window size"
            }
          ]
        },
        {
          "id": 10,
          "type": "stat",
          "title": "ML Fraud Rate",
          "gridPos": { "x": 6, "y": 20, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "ml_business_fraud_rate",
              "legendFormat": "fraud rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "ML Legitimate Rate",
          "gridPos": { "x": 12, "y": 20, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "ml_business_legitimate_rate",
              "legendFormat": "legitimate rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "ML Drift Alerts 15m",
          "gridPos": { "x": 18, "y": 20, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(increase(ml_business_drift_alerts_total[15m]))",
              "legendFormat": "drift alerts"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "ML Business Prediction Rate",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum by (result, risk_level) (rate(ml_business_predictions_total[5m]))",
              "legendFormat": "{{result}} {{risk_level}}"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "ML Fraud Probability p95",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "histogram_quantile(0.95, rate(ml_business_probability_distribution_bucket[5m]))",
              "legendFormat": "probability p95"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "ML Amount Distribution p95",
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "histogram_quantile(0.95, rate(ml_business_amount_distribution_bucket[5m]))",
              "legendFormat": "amount p95"
            }
          ]
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "ML Risk Score p95",
          "gridPos": { "x": 12, "y": 32, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "histogram_quantile(0.95, rate(ml_business_risk_score_distribution_bucket[5m]))",
              "legendFormat": "risk score p95"
            }
          ]
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "ML Feature Drift Scores",
          "gridPos": { "x": 0, "y": 40, "w": 24, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "max by (feature) (ml_business_feature_drift_score)",
              "legendFormat": "{{feature}}"
            }
          ]
        }
      ]
    }
