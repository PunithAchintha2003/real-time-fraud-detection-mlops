apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: fraud-detection
data:
  dashboard-provider.yaml: |
    apiVersion: 1

    providers:
      - name: Fraud Detection Dashboards
        orgId: 1
        folder: Fraud Detection MLOps
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-fraud-dashboard
  namespace: fraud-detection
data:
  fraud-detection-observability.json: |
    {
      "uid": "fraud-detection-observability",
      "title": "Fraud Detection Observability",
      "tags": ["fraud-detection", "mlops", "kubernetes"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Backend Requests",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(fraud_backend_http_requests_total[5m]))",
              "legendFormat": "requests/sec"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Backend Memory",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "fraud_backend_process_resident_memory_bytes",
              "legendFormat": "memory"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "ML Service Memory",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "process_resident_memory_bytes{job=\"fraud-ml-service\"}",
              "legendFormat": "ml memory"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Prometheus Targets UP",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(up)",
              "legendFormat": "up targets"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Backend HTTP Request Rate",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum by (method, route, status_code) (rate(fraud_backend_http_requests_total[5m]))",
              "legendFormat": "{{method}} {{route}} {{status_code}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Backend Request Duration p95",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le, route) (rate(fraud_backend_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{route}} p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Backend CPU Seconds",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "rate(fraud_backend_process_cpu_seconds_total[5m])",
              "legendFormat": "backend cpu"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "ML Service CPU Seconds",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "rate(process_cpu_seconds_total{job=\"fraud-ml-service\"}[5m])",
              "legendFormat": "ml cpu"
            }
          ]
        }
      ]
    }
