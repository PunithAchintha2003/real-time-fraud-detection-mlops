apiVersion: v1
kind: Secret
metadata:
  name: fraud-detection-secret
  namespace: fraud-detection
type: Opaque
stringData:
  POSTGRES_USER: fraud_user
  POSTGRES_PASSWORD: fraud_password
  POSTGRES_DB: fraud_auth_db
  DATABASE_URL: postgresql://fraud_user:fraud_password@postgres-service:5432/fraud_auth_db?schema=public
  JWT_SECRET: dev_super_secret_change_later
  JWT_EXPIRES_IN: 1d
