apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: fraud-detection
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: backend-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: backend-migrate
          image: achintha2003/fraud-backend-migrate:k8s
          imagePullPolicy: IfNotPresent
          command:
            - npx
            - prisma
            - migrate
            - deploy
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-detection-secret
                  key: DATABASE_URL
