global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "fraud-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "backend:4000"
        labels:
          service: "fraud-backend"
          environment: "docker-compose"

  - job_name: "fraud-ml-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "fraud-api:8000"
        labels:
          service: "fraud-ml-service"
          environment: "docker-compose"

  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "prometheus:9090"
        labels:
          service: "prometheus"
          environment: "docker-compose"
