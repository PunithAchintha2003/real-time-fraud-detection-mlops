version: "3.9"

services:

  fraud-api:
    build: .

    container_name: fraud-detection-api

    ports:
      - "8000:8000"

    environment:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_EXPERIMENT_NAME: fraud-detection-model-comparison
      MLFLOW_REGISTERED_MODEL_NAME: FraudDetectionModel
      MLFLOW_MODEL_ALIAS: champion
      FRAUD_THRESHOLD: 0.5

    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
      - ./models:/app/models

    restart: unless-stopped